[tool.sdlc.ci]
# Written by python-sdlc's scripts/convert_repo.py: the Containerfile needs
# build secrets (a secret mount, or RHSM) that `sdlc ci` is not given. The
# publish workflow still builds it, with them.
skip = ["container-build", "container-smoke", "container-scan"]

[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/postiz"
rhsm = true
free-disk = true
boot = "command"
boot-command = "bash tests/test-container.sh \"$IMAGE\""
